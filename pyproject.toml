[project]
name = "fp-extraction"
version = "0.1.0"
description = "Footprint extraction from satellite imagery with DINOv3 + LoRA"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torchgeo>=0.10",
    "lightning>=2.6",
    "torchmetrics>=1.9",
    "transformers>=5.17",
    "peft>=0.21",
    "accelerate>=1.15",
    "safetensors>=0.8",
    "rasterio>=1.5",
    "geopandas>=1.1",
    "shapely>=2.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.10",
    "ipywidgets>=8.1.9",
]

[project.optional-dependencies]
cpu = ["torch>=2.7.0", "torchvision>=0.22.0"]
cu128 = ["torch>=2.7.0", "torchvision>=0.22.0"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu128" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
