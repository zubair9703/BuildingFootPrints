# Footprint extraction — full experiment configuration.

project:
  name: dinov3_lora_dpt
  output_root: outputs
  seed: 42

data:
  image_dir: FP_data/Images_v1
  mask_dir: FP_data/Masks_v1
  tiles: [image1, image2]

  # Native tile resolution (metres/pixel). Set to null to use each file's own resolution.
  target_res: 0.06

  # Complete grid built per tile with TorchGeo GriddedPatchSampler before splitting.
  patch_size: 512
  stride: 512

  # Where the grid + split metadata is written by scripts/build_grid.py.
  grid_path: outputs/grid_512_512_seed42.geojson

  # Grid cells are split within each tile, so every tile contributes to all three
  # splits. This is intentional; see README for the spatial-correlation caveat.
  split_ratios:
    train: 0.60
    val: 0.20
    test: 0.20

  # Imagery is uint8 stored as float32 by TorchGeo; scale to [0, 1] before normalising.
  value_scale: 255.0

  # DINOv3 SAT-493M statistics (not ImageNet).
  mean: [0.430, 0.411, 0.296]
  std: [0.213, 0.156, 0.143]

  batch_size: 4
  num_workers: 4

augmentation:
  # Applied to training patches only; validation and test are deterministic.
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rot90: 0.5
  affine_probability: 0.5
  rotation_degrees: 10.0
  translate_fraction: 0.05
  scale_range: [0.9, 1.1]

model:
  checkpoint: facebook/dinov3-vitl16-pretrain-sat493m
  # Hidden states to expose as feature maps. Index 0 is the patch embedding,
  # 1..24 are the transformer layers of ViT-L/16.
  out_indices: [6, 12, 18, 24]
  decoder: dpt          # dpt | cnn
  decoder_channels: 256

  lora:
    enabled: true
    rank: 16
    alpha: 32
    dropout: 0.05
    # Hugging Face DINOv3 module names. The Meta/timm implementation instead
    # uses fused `qkv` / `proj` names.
    target_modules: [q_proj, k_proj, v_proj, o_proj]

loss:
  bce_weight: 0.5
  dice_weight: 0.5
  dice_smooth: 1.0

training:
  max_epochs: 500
  lora_lr: 1.0e-4
  decoder_lr: 3.0e-4
  weight_decay: 0.01
  precision: bf16-mixed
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0

  scheduler:
    name: cosine        # cosine | reduce_on_plateau
    min_lr: 1.0e-6
    # reduce_on_plateau only
    factor: 0.5
    patience: 5

  early_stopping:
    enabled: true
    monitor: val_iou
    mode: max
    patience: 30
    min_delta: 0.001

evaluation:
  threshold: 0.5
  num_test_plots: 8

logging:
  plot_every_n_epochs: 5
  num_visualization_samples: 4
